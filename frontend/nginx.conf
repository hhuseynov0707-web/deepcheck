server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # /demo and /dashboard are client-side routes; there is no file at those
    # paths, so a plain 404 would break every deep link and every refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change whenever their content does, so they are
    # safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The SDK keeps its filename across releases, so it must NOT be cached
    # hard: a browser holding an old deepcheck.js would keep posting an
    # outdated payload shape long after the backend moved on.
    location = /deepcheck.js {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # This server holds no secrets and no API surface, but these cost nothing
    # and a fintech reviewer will look for them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
