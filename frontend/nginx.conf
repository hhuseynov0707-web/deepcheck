server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No access log: nginx's default one records every visitor's IP address,
    # and this server has no use for it. It also covers the /api/ proxy below,
    # which inherits it, so putting the API behind this server did not start a
    # log of every scored request. The error log stays on, and nginx names the
    # client address in an error line -- including each API call answered 502
    # while the backend is still starting or training its model -- so the
    # privacy statement says so rather than claiming no IP anywhere.
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. The /api/ proxy names the backend through a
    # variable, which makes nginx look it up when a request needs it (cached
    # for 10 s) instead of once at startup. A literal
    # `proxy_pass http://backend:8000;` is resolved when the config loads:
    # nginx refuses to start if the backend container does not exist yet,
    # keeps the OLD address after the backend restarts (restart:
    # unless-stopped) and answers 502 for the rest of the demo, and fails
    # `nginx -t` anywhere outside the compose network. The compose network is
    # IPv4, hence ipv6=off.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Inherited only by locations below that set no add_header of their own;
    # every location that does includes the snippet again (see the snippet for
    # why).
    include /etc/nginx/snippets/security-headers.conf;

    # /demo and /dashboard are client-side routes; there is no file at those
    # paths, so a plain 404 would break every deep link and every refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change whenever their content does, so they are
    # safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The SDK keeps its filename across releases, so it must NOT be cached
    # hard: a browser holding an old deepcheck.js would keep posting an
    # outdated payload shape long after the backend moved on.
    location = /deepcheck.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The API, on the page's own origin. The bundle is built with an empty
    # VITE_API_URL (frontend/src/apiBase.js), so the browser calls /api/... on
    # whatever address it loaded the page from and this block hands it to the
    # backend over the compose network. That is what lets a second laptop open
    # http://<presenter-IP>:3000/demo with no address compiled into the bundle,
    # no rebuild when the venue hands out a new IP, no CORS, and only port
    # 3000 reachable from the network: the backend's own port stays on
    # loopback (API_BIND_ADDR in docker-compose.yml).
    #
    # Everything under /api/ is forwarded, including the endpoints only a
    # merchant's SERVER calls (/api/decision, /api/outcome, /api/profile/...).
    # They are deliberately not blocked here: each checks its own credential
    # (X-Merchant-Key, a per-operator review key, X-Dashboard-Key), which is
    # the same exposure as publishing port 8000 itself, and a deny list at the
    # edge would be a second copy of main.py's routes to keep in step. FastAPI's
    # /docs and /openapi.json sit outside /api/ and are not forwarded.
    location /api/ {
        set $deepcheck_api http://backend:8000;
        # No URI part after the address, so /api/... reaches the backend
        # exactly as the browser sent it, query string included.
        proxy_pass $deepcheck_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # REPLACED with the address nginx itself sees, never appended to with
        # $proxy_add_x_forwarded_for: a client can send any X-Forwarded-For it
        # likes, and an appended chain would carry those invented addresses
        # through, fresh ones on every request if a bot wanted them. The
        # backend ignores the header anyway unless FORWARDED_ALLOW_IPS names
        # this proxy (see _client_ip in backend/main.py).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The SDK caps each list it sends (LIMITS in sdk/deepcheck.js: 2000
        # pointer points, 1000 keys, ...), which puts the largest legal
        # /api/analyze body at roughly 200 KB -- an estimate from those caps,
        # not a measurement. 512k leaves headroom and still turns a
        # multi-megabyte body away before it reaches Python.
        client_max_body_size 512k;
        # The SDK abandons a request after 10 s (REQUEST_TIMEOUT_MS), and the
        # demo page waits at most 4 s for its pre-charge flush. Nothing a
        # browser would still be waiting for needs longer than these.
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        # Scores, session tokens and decisions belong to one session at one
        # moment; no cache between here and the browser may keep one.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
