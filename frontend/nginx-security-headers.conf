# Security headers for every response nginx sends, pages and API alike.
#
# Included from nginx.conf at server level AND inside every location that sets
# an add_header of its own, because nginx inherits add_header from the
# enclosing level only into locations that declare none. A location with its
# own Cache-Control silently loses these three otherwise -- which is how every
# HTML page (/demo and /dashboard fall back to /index.html) went out without
# them while the config appeared to set them. The Dockerfile copies this file
# to /etc/nginx/snippets/security-headers.conf.
#
# This server holds no secrets, but it does carry the checkout and the SOC
# dashboard, these cost nothing, and a fintech reviewer will look for them.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
