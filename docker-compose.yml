services:
  db:
    image: postgres:16-alpine
    container_name: deepcheck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepcheck
      POSTGRES_PASSWORD: deepcheck
      POSTGRES_DB: deepcheck
    # Bound to loopback, not 0.0.0.0. Published on every interface with the
    # development credentials above, this hands anyone who can reach the host
    # read and write access to session scores and behavioral evidence -- which
    # is the input to the charge decision. The backend reaches the database
    # over the compose network and does not need this mapping at all; it is
    # kept on localhost only so `psql` works during development.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - deepcheck-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepcheck -d deepcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: deepcheck-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://deepcheck:deepcheck@db:5432/deepcheck
      # Compose reads these from a .env file next to this one (see
      # .env.example). Left unset, DEBUG=1 keeps the local demo working with
      # a fixed development secret and logs a warning on every boot; with
      # DEBUG=0 the backend REFUSES TO START unless both are provided, so a
      # production deployment cannot silently run with authentication off.
      DEEPCHECK_SECRET: ${DEEPCHECK_SECRET:-}
      DASHBOARD_KEY: ${DASHBOARD_KEY:-}
      DEBUG: ${DEBUG:-1}
      # Step-up code accepted by POST /api/demo/verify. A demo stand-in for
      # the merchant's SMS / 3-D Secure provider; shown in the demo's modal.
      DEMO_VERIFY_CODE: ${DEMO_VERIFY_CODE:-482913}
    # Loopback, like the database. DEBUG defaults to 1 so that
    # `docker-compose up` works with no configuration, and DEBUG=1 means the
    # published development secrets are in force -- session tokens anyone can
    # forge and a dashboard key anyone can read. Those two defaults are only
    # safe together if the port is not reachable from the network, so it is
    # not. Exposing this deliberately means setting DEBUG=0 with real secrets
    # first; see .env.example.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Vite inlines these at build time, so they are build args rather than
      # runtime environment. Change one and rebuild the image.
      #
      # There is deliberately NO dashboard key here: a key compiled into the
      # bundle is served to every visitor, which makes the header check on the
      # SOC endpoints decoration rather than authentication. The analyst types
      # it into the dashboard instead.
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_DEMO_VERIFY_CODE: ${DEMO_VERIFY_CODE:-482913}
    container_name: deepcheck-frontend
    restart: unless-stopped
    # Loopback for the same reason: the demo page ships the step-up code and
    # talks to an API running in development mode.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  deepcheck-db-data:
