services:
  db:
    image: postgres:16-alpine
    container_name: deepcheck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepcheck
      POSTGRES_PASSWORD: deepcheck
      POSTGRES_DB: deepcheck
    ports:
      - "5432:5432"
    volumes:
      - deepcheck-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepcheck -d deepcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: deepcheck-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://deepcheck:deepcheck@db:5432/deepcheck
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    # On a clean clone model.pkl does not exist, so entrypoint.sh trains it on
    # first boot -- 50k rows through Random Forest, Isolation Forest and LSTM.
    # Without this the frontend came up immediately and showed fetch errors
    # until training finished. start_period keeps failures from counting while
    # that runs; the container flips to healthy as soon as /api/health reports
    # the model loaded. /api/health answers 200 with model_loaded:false when
    # the model is missing, so the check asserts that field rather than merely
    # that the port is listening.
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import json,urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8000/api/health'))['model_loaded']"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 600s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: deepcheck-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - ./sdk:/app/sdk
      - /app/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  deepcheck-db-data:
