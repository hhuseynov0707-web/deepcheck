services:
  db:
    image: postgres:16-alpine
    container_name: deepcheck-db
    restart: unless-stopped
    # Read from .env, defaulting to the development values so a bare
    # `docker-compose up` still works. Postgres applies these only when it
    # initialises an EMPTY data volume: changing POSTGRES_PASSWORD later does
    # not change the password of an existing database (see .env.example).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepcheck}
      POSTGRES_DB: ${POSTGRES_DB:-deepcheck}
    # Bound to loopback, not 0.0.0.0 -- and deliberately NOT governed by
    # BIND_ADDR below. Published on every interface with the development
    # credentials above, this hands anyone who can reach the host read and
    # write access to session scores and behavioral evidence -- which is the
    # input to the charge decision. The backend reaches the database over the
    # compose network and does not need this mapping at all; it is kept on
    # localhost only so `psql` and record_session.py work from the host.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - deepcheck-db-data:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container's shell, so the check follows
      # whatever user and database the variables above resolved to.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: deepcheck-backend
    restart: unless-stopped
    environment:
      # Built from the same variables as the db service, so the two cannot
      # drift apart. The password is embedded in a URL: keep it to letters,
      # digits, "-" and "_" (secrets.token_urlsafe output qualifies).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-deepcheck}:${POSTGRES_PASSWORD:-deepcheck}@db:5432/${POSTGRES_DB:-deepcheck}
      # Compose reads these from a .env file next to this one (see
      # .env.example). Left unset, DEBUG=1 keeps the local demo working with
      # a fixed development secret and logs a warning on every boot; with
      # DEBUG=0 the backend REFUSES TO START unless both are provided, so a
      # production deployment cannot silently run with authentication off.
      DEEPCHECK_SECRET: ${DEEPCHECK_SECRET:-}
      DASHBOARD_KEY: ${DASHBOARD_KEY:-}
      DEBUG: ${DEBUG:-1}
      # Step-up code accepted by POST /api/demo/verify. A demo stand-in for
      # the merchant's SMS / 3-D Secure provider; shown in the demo's modal.
      DEMO_VERIFY_CODE: ${DEMO_VERIFY_CODE:-482913}
      # Optional knobs documented in .env.example. Until these lines existed
      # none of them reached the container: compose uses .env for
      # substitution in this file, not as the container's environment, so
      # setting CORS_ORIGINS in .env changed nothing. A key with no value is
      # passed only when it is set, and otherwise left out entirely, so the
      # backend's own default applies. That matters: an EMPTY DEMO_ENDPOINTS
      # would read as "off" even under DEBUG=1, and an empty CORS_ORIGINS as
      # "allow no origin".
      CORS_ORIGINS:
      DEMO_ENDPOINTS:
      SHAP_IN_ANALYZE:
      CLUSTER_ESCALATION:
      POW_DIFFICULTY_BITS:
      RAW_RETENTION_HOURS:
      ROW_RETENTION_HOURS:
      PROFILE_RETENTION_DAYS:
      DECISION_AUDIT_RETENTION_DAYS:
      PROFILE_ACCESS_RETENTION_DAYS:
      # Per-customer profile layer. All unset by default, and unset means OFF
      # in every mode: there is no development fallback for any of these.
      DEEPCHECK_MERCHANT_KEYS:
      DEEPCHECK_PROFILE_KEY:
      DEEPCHECK_PROFILE_KEY_VERSION:
      PROFILE_LAYER:
      PROFILE_ESCALATION:
      PROFILE_REVIEW_KEYS:
      UVICORN_WORKERS:
    # Loopback by default, like the database. DEBUG defaults to 1 so that
    # `docker-compose up` works with no configuration, and DEBUG=1 means the
    # published development secrets are in force -- session tokens anyone can
    # forge and a dashboard key anyone can read. Those two defaults are only
    # safe together if the port is not reachable from the network, so by
    # default it is not. BIND_ADDR=0.0.0.0 exposes it, for a demo on a phone
    # over the LAN; set DEBUG=0 with real secrets first. .env.example lists
    # every step.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    volumes:
      - ./backend:/app
      # The real-browser telemetry the model trains on. Without this the
      # container resolves lab/real_telemetry.json to /lab (the parent of
      # /app) and finds nothing, so it trains on synthetic data ONLY and says
      # so in one line nobody reads -- while the host, where lab/ sits next to
      # backend/, trains on the real rows. The two then disagree about what
      # the model has learned, and the deployed one is the weaker.
      - ./lab:/lab:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Vite inlines these at build time, so they are build args rather than
      # runtime environment. Change one and rebuild the image.
      #
      # There is deliberately NO dashboard key here: a key compiled into the
      # bundle is served to every visitor, which makes the header check on the
      # SOC endpoints decoration rather than authentication. The analyst types
      # it into the dashboard instead.
      #
      # VITE_API_URL is the address the VISITOR'S browser uses to reach the
      # backend, not the one this container uses. "localhost" in it means the
      # visitor's own device, so a phone given the default bundle talks to
      # itself. A LAN demo needs http://<LAN-IP>:8000 here and a rebuild.
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_DEMO_VERIFY_CODE: ${DEMO_VERIFY_CODE:-482913}
    container_name: deepcheck-frontend
    restart: unless-stopped
    # Loopback by default for the same reason: the demo page ships the step-up
    # code and talks to an API running in development mode. BIND_ADDR opens
    # it together with the backend; one without the other is a page that
    # cannot reach its API.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    depends_on:
      - backend

volumes:
  deepcheck-db-data:
