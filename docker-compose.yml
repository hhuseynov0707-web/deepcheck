services:
  db:
    image: postgres:16-alpine
    container_name: deepcheck-db
    restart: unless-stopped
    # Read from .env, defaulting to the development values so a bare
    # `docker-compose up` still works. Postgres applies these only when it
    # initialises an EMPTY data volume: changing POSTGRES_PASSWORD later does
    # not change the password of an existing database (see .env.example).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepcheck}
      POSTGRES_DB: ${POSTGRES_DB:-deepcheck}
    # Bound to loopback, not 0.0.0.0 -- and deliberately NOT governed by
    # BIND_ADDR or API_BIND_ADDR below. Published on every interface with the
    # development credentials above, this hands anyone who can reach the host
    # read and write access to session scores and behavioral evidence --
    # which is the input to the charge decision. The backend reaches the
    # database over the compose network and does not need this mapping at
    # all; it is kept on localhost only so `psql` and record_session.py work
    # from the host.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - deepcheck-db-data:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container's shell, so the check follows
      # whatever user and database the variables above resolved to.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: deepcheck-backend
    restart: unless-stopped
    environment:
      # Built from the same variables as the db service, so the two cannot
      # drift apart. The password is embedded in a URL: keep it to letters,
      # digits, "-" and "_" (secrets.token_urlsafe output qualifies).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-deepcheck}:${POSTGRES_PASSWORD:-deepcheck}@db:5432/${POSTGRES_DB:-deepcheck}
      # Compose reads these from a .env file next to this one (see
      # .env.example). Left unset, DEBUG=1 keeps the local demo working with
      # a fixed development secret and logs a warning on every boot; with
      # DEBUG=0 the backend REFUSES TO START unless both are provided, so a
      # production deployment cannot silently run with authentication off.
      DEEPCHECK_SECRET: ${DEEPCHECK_SECRET:-}
      DASHBOARD_KEY: ${DASHBOARD_KEY:-}
      DEBUG: ${DEBUG:-1}
      # Step-up code accepted by POST /api/demo/verify. A demo stand-in for
      # the merchant's SMS / 3-D Secure provider; shown in the demo's modal.
      DEMO_VERIFY_CODE: ${DEMO_VERIFY_CODE:-482913}
      # Optional knobs documented in .env.example. Until these lines existed
      # none of them reached the container: compose uses .env for
      # substitution in this file, not as the container's environment, so
      # setting CORS_ORIGINS in .env changed nothing. A key with no value is
      # passed only when it is set, and otherwise left out entirely, so the
      # backend's own default applies. That matters: an EMPTY DEMO_ENDPOINTS
      # would read as "off" even under DEBUG=1, and an empty CORS_ORIGINS as
      # "allow no origin".
      CORS_ORIGINS:
      DEMO_ENDPOINTS:
      SHAP_IN_ANALYZE:
      CLUSTER_ESCALATION:
      POW_DIFFICULTY_BITS:
      RAW_RETENTION_HOURS:
      ROW_RETENTION_HOURS:
      PROFILE_RETENTION_DAYS:
      DECISION_AUDIT_RETENTION_DAYS:
      PROFILE_ACCESS_RETENTION_DAYS:
      # Per-customer profile layer. All unset by default, and unset means OFF
      # in every mode: there is no development fallback for any of these.
      DEEPCHECK_MERCHANT_KEYS:
      DEEPCHECK_PROFILE_KEY:
      DEEPCHECK_PROFILE_KEY_VERSION:
      PROFILE_LAYER:
      PROFILE_ESCALATION:
      PROFILE_REVIEW_KEYS:
      UVICORN_WORKERS:
      # Read by uvicorn itself, not by main.py: the peer addresses it trusts
      # to name the real client in X-Forwarded-For. Unset, uvicorn trusts
      # 127.0.0.1 only, and every browser that comes through the frontend's
      # /api/ proxy reaches the backend from the nginx container's address --
      # so the per-IP session-minting limit is one bucket shared by every
      # visitor. Setting it to that container's address restores per-visitor
      # keying. Exact addresses only (uvicorn 0.30.1 has no CIDR support), and
      # never "*", which believes whatever the caller writes. Not pinned here,
      # because pinning the proxy's address means pinning a compose subnet,
      # and a subnet that collides with another Docker network on the
      # presenter's laptop stops `up` with "Pool overlaps". See _client_ip in
      # backend/main.py and .env.example.
      FORWARDED_ALLOW_IPS:
    # Loopback by default, like the database, and NOT opened by BIND_ADDR any
    # more. Browsers reach the API through the frontend's nginx on port 3000
    # (same origin, frontend/nginx.conf), so a LAN demo needs only 3000 on the
    # network. DEBUG defaults to 1 so that `docker-compose up` works with no
    # configuration, and DEBUG=1 means the published development secrets are
    # in force -- session tokens anyone can forge and a dashboard key anyone
    # can read; the less of this that is reachable, the better.
    #
    # API_BIND_ADDR=0.0.0.0 publishes 8000 itself, for the two cases that
    # still talk to it directly from another machine: a bundle built with a
    # cross-origin VITE_API_URL, and the lab harness (lab/bot_lab.py --api).
    # Set DEBUG=0 with real secrets first. .env.example lists every step.
    ports:
      - "${API_BIND_ADDR:-127.0.0.1}:8000:8000"
    volumes:
      - ./backend:/app
      # The real-browser telemetry the model trains on. Without this the
      # container resolves lab/real_telemetry.json to /lab (the parent of
      # /app) and finds nothing, so it trains on synthetic data ONLY and says
      # so in one line nobody reads -- while the host, where lab/ sits next to
      # backend/, trains on the real rows. The two then disagree about what
      # the model has learned, and the deployed one is the weaker.
      - ./lab:/lab:ro
      # The recorded-session archive, for the same reason and with the same
      # failure mode as the line above. train_model.py reads
      # data/real/{human,bot}/*.json as a second source of real rows; without
      # this mount the container resolves that to /data/real, finds nothing,
      # and trains on the browser lab plus synthetic data only -- while the
      # host, where data/ sits next to backend/, trains on the recordings too.
      # A cold container retrains on its own (entrypoint.sh), so this is not a
      # hypothetical path: delete the bundle and the deployed model quietly
      # becomes the weaker one.
      #
      # Read-only. Nothing in the container writes here: record_session.py
      # runs on the host, against the database's loopback port.
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Vite inlines these at build time, so they are build args rather than
      # runtime environment. Change one and rebuild the image.
      #
      # There is deliberately NO dashboard key here: a key compiled into the
      # bundle is served to every visitor, which makes the header check on the
      # SOC endpoints decoration rather than authentication. The analyst types
      # it into the dashboard instead.
      #
      # VITE_API_URL is the address the VISITOR'S browser uses to reach the
      # backend, not the one this container uses. Empty, the default, means
      # same origin: the browser calls /api/... on the address it loaded the
      # page from, and this image's nginx forwards it to the backend. Nothing
      # about the network is compiled in, so a LAN demo needs no rebuild when
      # the address changes. Setting it (http://<host>:8000) points every
      # visitor at an API on a different origin; that also needs
      # API_BIND_ADDR and CORS_ORIGINS. `:-` here and an empty ARG default in
      # the Dockerfile, so unset and empty both build the same-origin bundle.
      # The old default, http://localhost:8000, made a second laptop or a
      # phone talk to itself.
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_DEMO_VERIFY_CODE: ${DEMO_VERIFY_CODE:-482913}
    container_name: deepcheck-frontend
    restart: unless-stopped
    # Loopback by default for the same reason: the demo page ships the step-up
    # code and talks to an API running in development mode. BIND_ADDR=0.0.0.0
    # opens this one port to the network, and with it the page AND the API,
    # since /api/ is proxied from here (frontend/nginx.conf). Set DEBUG=0 with
    # real secrets first: everything under /api/ is reachable through it.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    depends_on:
      - backend

volumes:
  deepcheck-db-data:
