services:
  db:
    image: postgres:16-alpine
    container_name: deepcheck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepcheck
      POSTGRES_PASSWORD: deepcheck
      POSTGRES_DB: deepcheck
    ports:
      - "5432:5432"
    volumes:
      - deepcheck-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepcheck -d deepcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: deepcheck-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://deepcheck:deepcheck@db:5432/deepcheck
      # Session-token signing key. Must be set explicitly: without it each
      # uvicorn worker generates its own, so a token issued by one worker is
      # rejected by the next request that lands on another. Replace both of
      # these for anything other than a local demo.
      DEEPCHECK_SECRET: ${DEEPCHECK_SECRET:-demo-only-session-secret-change-me}
      # Gates the SOC dashboard read endpoints; must match the frontend's
      # VITE_OPERATOR_KEY below.
      DEEPCHECK_OPERATOR_KEY: ${DEEPCHECK_OPERATOR_KEY:-demo-only-operator-key-change-me}
      DEEPCHECK_ALLOWED_ORIGINS: ${DEEPCHECK_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Returns the step-up code in the API response so the demo is operable
      # without an SMS provider. Set to 0 for a real deployment.
      DEEPCHECK_DEMO_MODE: ${DEEPCHECK_DEMO_MODE:-1}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: deepcheck-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
      # Must match the backend's DEEPCHECK_OPERATOR_KEY. This ends up in the
      # frontend bundle, so it is a deployment gate, not user authentication.
      VITE_OPERATOR_KEY: ${DEEPCHECK_OPERATOR_KEY:-demo-only-operator-key-change-me}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - ./sdk:/app/sdk
      - /app/frontend/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  deepcheck-db-data:
