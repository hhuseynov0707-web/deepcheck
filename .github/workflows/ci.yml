name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Same CPU torch index the Dockerfile uses. From PyPI the default linux
      # torch wheel pulls the CUDA runtime as nvidia-* dependencies, which is
      # a couple of gigabytes a CPU-only test job has no use for.
      - name: Install dependencies
        run: |
          pip install --timeout 180 --retries 10             --index-url https://download.pytorch.org/whl/cpu             --extra-index-url https://pypi.org/simple             -r backend/requirements.txt pytest

      # Trains the real model, not a reduced one. The scoring tests assert
      # thresholds ("a headless bot scores above 70") that are properties of
      # the shipped model; a smaller training set produces a different model
      # and those assertions stop meaning anything -- they would either fail
      # spuriously or pass without testing what they claim. Roughly 5-10
      # minutes, which is a fair price for a signal that is actually about the
      # artifact users get. N_SESSIONS exists for local experiments.
      - name: Train the model
        working-directory: backend
        run: python train_model.py

      # No Postgres service on purpose: the API tests override get_db with a
      # stub, precisely so an authorization check never depends on
      # infrastructure being up in order to be tested.
      #
      # Every test file in backend/, not a named one. Naming test_scorer.py
      # meant a new test file ran locally and never in CI, which is the same
      # as not having it.
      - name: Run tests
        working-directory: backend
        env:
          DEEPCHECK_SECRET: ci-secret-not-for-production
          DASHBOARD_KEY: ci-dashboard-key
          DEBUG: "0"
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache keyed on the lockfile, which is what `npm ci` installs. Keyed on
      # package.json the cache survived dependency changes that only moved
      # the lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, like the Docker image: exactly the lockfile, and a failure
      # rather than a silent rewrite when it has drifted from package.json.
      # `npm install` could pass CI on a dependency tree nobody committed.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      # The dashboard key must never be compiled into the bundle: anything in
      # here is served to every visitor, which would turn the header check on
      # the SOC endpoints into decoration. Fail the build if it reappears.
      - name: Assert no dashboard key in the bundle
        working-directory: frontend
        run: |
          if grep -rIlE 'VITE_DASHBOARD_KEY|deepcheck-dev-pano-anahtari' dist/; then
            echo "Dashboard key found in the built bundle" >&2
            exit 1
          fi
          echo "OK: no dashboard key in dist/"

  compose:
    name: Compose and frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `docker-compose up --build` is the one command the README promises
      # works. A typo in an interpolation or a port mapping breaks it for
      # everyone and no unit test would notice. Validates the default and the
      # dev override, with no .env, the way a first-time reviewer runs it.
      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      # The frontend image is built from the lockfile with `npm ci` and a
      # Dockerfile-specific ignore file; neither is exercised by `npm run
      # build` on the runner. The backend image is left out: it installs
      # torch, and the backend job already installs the same requirements.
      - name: Build the frontend image
        run: docker compose build frontend
