name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Same CPU torch index the Dockerfile uses. From PyPI the default linux
      # torch wheel pulls the CUDA runtime as nvidia-* dependencies, which is
      # a couple of gigabytes a CPU-only test job has no use for.
      - name: Install dependencies
        run: |
          pip install --timeout 180 --retries 10             --index-url https://download.pytorch.org/whl/cpu             --extra-index-url https://pypi.org/simple             -r backend/requirements.txt pytest

      # Trains the real model, not a reduced one. The scoring tests assert
      # thresholds ("a headless bot scores above 70") that are properties of
      # the shipped model; a smaller training set produces a different model
      # and those assertions stop meaning anything -- they would either fail
      # spuriously or pass without testing what they claim. Roughly 5-10
      # minutes, which is a fair price for a signal that is actually about the
      # artifact users get. N_SESSIONS exists for local experiments.
      - name: Train the model
        working-directory: backend
        run: python train_model.py

      # No Postgres service on purpose: the API tests override get_db with a
      # stub, precisely so an authorization check never depends on
      # infrastructure being up in order to be tested.
      #
      # Every test file in backend/, not a named one. Naming test_scorer.py
      # meant a new test file ran locally and never in CI, which is the same
      # as not having it.
      - name: Run tests
        working-directory: backend
        env:
          DEEPCHECK_SECRET: ci-secret-not-for-production
          DASHBOARD_KEY: ci-dashboard-key
          DEBUG: "0"
        run: python -m pytest -q

  # The two demo apps' servers (docs/architecture-two-apps.md). Their tests mock
  # the core with httpx, so neither needs Postgres, the model or torch.
  app-servers:
    name: App server tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [apps/checkout-server, apps/soc-server]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.app }}/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: pip install -r requirements-dev.txt

      - name: Test
        working-directory: ${{ matrix.app }}
        run: python -m pytest -q

  # The stage bot runs on a teammate's laptop with the standard library only;
  # its tests use pytest and nothing else.
  stage-bot:
    name: Stage bot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: |
          pip install pytest==8.2.2
          python -m pytest -q lab/test_live_bot.py

  app-webs:
    name: App web build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [apps/checkout, apps/soc]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci --no-audit --no-fund

      - name: Test
        working-directory: ${{ matrix.app }}
        run: npm test

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

      # Both apps call their own origin; an absolute core address compiled in
      # would make laptop B's browser talk to itself. And no dashboard key may
      # ever reach a bundle: the SOC key lives in soc-api only.
      - name: Assert same-origin API and no key in the bundle
        working-directory: ${{ matrix.app }}
        run: |
          if grep -rIl 'localhost:8000' dist/assets/; then
            echo "Absolute core address compiled into the bundle" >&2
            exit 1
          fi
          if grep -rIlE 'VITE_DASHBOARD_KEY|deepcheck-dev-pano-anahtari' dist/; then
            echo "Dashboard key found in the built bundle" >&2
            exit 1
          fi
          echo "OK"

  compose:
    name: Compose and web images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `docker-compose up --build` is the one command the README promises
      # works. A typo in an interpolation or a port mapping breaks it for
      # everyone and no unit test would notice. Validated with no .env, the
      # way a first-time reviewer runs it.
      - name: Validate the compose file
        run: |
          docker compose config --quiet

      # The two apps' images: their nginx configs, Dockerfile-specific ignore
      # files and repo-root build contexts are exercised nowhere else, and the
      # web images install from the lockfile with `npm ci`. The backend image
      # is left out: it installs torch, and the backend job already installs
      # the same requirements.
      - name: Build the web and app images
        run: docker compose build checkout-web checkout-api soc-web soc-api
