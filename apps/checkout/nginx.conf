# checkout-web: TechStore's checkout page, the store's API and the behaviour
# SDK's path to the DeepCheck core, all on ONE origin. This is the only
# service published beyond loopback (docs/architecture-two-apps.md).
#
#   /                 the SPA (apps/checkout)
#   /deepcheck.js     the SDK file (sdk/deepcheck.js, copied in by the build)
#   /api/             checkout-api:8100, path unchanged
#   /deepcheck/api/   the core (backend:8000), prefix stripped -- the SDK's
#                     session, attest and analyze calls ONLY (see below)
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No access log: nginx's default one records every visitor's address and
    # this server has no use for it. The error log stays on, and nginx names
    # the client address in an error line (e.g. a 502 while a backend is
    # starting); the /gizlilik page says so rather than claiming no IP
    # anywhere.
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. The proxies name their upstreams through
    # variables, which makes nginx resolve them per request (cached 10 s)
    # instead of once at startup: a literal name fails `nginx -t` outside the
    # compose network, refuses to start if the upstream container does not
    # exist yet, and keeps a stale address after that container restarts. The
    # compose network is IPv4, hence ipv6=off.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Inherited only by locations that set no add_header of their own; every
    # location that does includes the snippet again (see the snippet for why).
    include /etc/nginx/snippets/security-headers.conf;

    # /gizlilik is a client-side route: there is no file at that path, so a
    # plain 404 would break the footer link and every refresh of it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames change whenever their content does: safe to cache hard.
    # The bundled fonts live here too.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The SDK keeps its filename across releases, so it must NOT be cached
    # hard: a browser holding an old deepcheck.js would keep posting an
    # outdated payload shape long after the core moved on.
    location = /deepcheck.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The store's own server. Path unchanged: /api/cart reaches checkout-api
    # as /api/cart.
    location /api/ {
        set $checkout_api http://checkout-api:8100;
        proxy_pass $checkout_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # REPLACED with the address nginx saw, never appended to with
        # $proxy_add_x_forwarded_for. checkout-api keys its rate limit on this
        # header and trusts it from any peer (its Dockerfile,
        # FORWARDED_ALLOW_IPS), which is safe only because this line throws
        # away whatever X-Forwarded-For the browser sent.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A checkout body is a session id, a token and four card display
        # fields (last 4, brand, expiry month and year; no e-mail address,
        # it is a guest checkout): well under 1 KB.
        client_max_body_size 16k;
        proxy_connect_timeout 3s;
        # Longer than the core proxy below on purpose: checkout-api may wait
        # 3 x 2 s for more behaviour before it answers (its hidden
        # insufficient-evidence retry), plus up to four core calls with a 4 s
        # read timeout each. The page itself gives up after 30 s
        # (src/lib/api.js).
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The behaviour SDK's calls, to the core: exactly the endpoints
    # sdk/deepcheck.js uses, plus /api/health (lab/live_bot.py probes it to
    # find the store path). An ALLOW list, unlike the former demo's open
    # /api/ proxy (removed 2026-10-02), because this is the one port on the
    # LAN and the store's decisions must go through the store:
    #   * /api/decision and /api/demo/verify answered here would let a page
    #     skip checkout-api -- including its rule that only a session the
    #     store itself challenged may submit an OTP;
    #   * /api/sessions, /api/score/..., /api/profile/... and /api/outcome
    #     are the SOC's and the merchant server's, never a browser's.
    # The rewrite strips the prefix so /deepcheck/api/analyze reaches the core
    # as /api/analyze (query string kept); with a variable proxy_pass and no
    # URI part, nginx sends the rewritten URI.
    location ~ ^/deepcheck/api/(session|session/attest|analyze|health)$ {
        set $deepcheck_core http://backend:8000;
        rewrite ^/deepcheck/(.*)$ /$1 break;
        proxy_pass $deepcheck_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replaced, never appended: see /api/ above. The core ignores it unless
        # its FORWARDED_ALLOW_IPS names this proxy (_client_ip in
        # backend/main.py).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The payer must not be told their own risk score. Without this the
        # core's /api/analyze reply carries the score and label every 2 s,
        # readable in DevTools or from a script, which is the tuning signal
        # the store/SOC split exists to remove. With it, the core still
        # checks, scores and stores every window but answers only
        # {session_id, accepted} (ANALYZE_ACK_REPLY in backend/main.py); the
        # store's server asks /api/decision on its own. Set, not passed
        # through: proxy_set_header replaces whatever the browser sent under
        # this name, so a client cannot drop it, and the core's port is on
        # loopback unless API_BIND_ADDR opens it (docker-compose.yml), so by
        # default there is no way round this proxy from the LAN. The other
        # three paths ignore the header.
        proxy_set_header X-DeepCheck-Reply "ack";
        # The SDK caps each list it sends (LIMITS in sdk/deepcheck.js), which
        # puts the largest legal /api/analyze body at roughly 200 KB -- an
        # estimate from those caps, not a measurement. Same ceiling the former
        # demo's nginx used.
        client_max_body_size 512k;
        # The SDK abandons a request after 10 s (REQUEST_TIMEOUT_MS).
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        # Session tokens belong to one session at one moment; nothing between
        # here and the browser may cache one.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Everything else under the SDK prefix: not the SPA's index.html (a 200
    # with HTML where a client expected JSON hides the mistake), a plain 404.
    location /deepcheck/ {
        return 404;
    }
}
