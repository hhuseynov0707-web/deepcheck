# Security headers for every response nginx sends, pages and API alike.
#
# Included from nginx.conf at server level AND inside every location that sets
# an add_header of its own, because nginx inherits add_header from the
# enclosing level only into locations that declare none: a location with its
# own Cache-Control silently loses these otherwise. The Dockerfile copies this
# file to /etc/nginx/snippets/security-headers.conf (not conf.d/, whose *.conf
# files nginx would load on their own at http level).
#
# DENY also means no other site can frame the payment form to overlay it.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# This page holds the full card number and CVV in JS memory, and "never sent
# to any server" (the footer, /gizlilik) was until now a property of the
# application code only. connect-src 'self' makes it the browser's too: a
# script that got onto the page (an edited dependency, a pasted third-party
# tag) cannot post them to another host. Same policy as the SOC
# (apps/soc/nginx-security-headers.conf), and it fits this build as it is:
#   * scripts: the bundle in /assets/ and the SDK at /deepcheck.js, both
#     same-origin files -- the built index.html has no inline script;
#   * styles: one CSS file in /assets/; the source has no style attribute
#     and no <style> element;
#   * fonts: the bundled IBM Plex files in /assets/;
#   * images: the tab icon is a data: URI in index.html, every other graphic
#     is inline SVG markup;
#   * connections: /api/ (the store's server) and /deepcheck/api/ (the SDK's
#     proxied path to the core), both this origin. The SDK uses fetch and
#     crypto.subtle only -- no eval, no workers, no beacons.
# form-action 'self': the forms are submitted by script and never navigate;
# a <form action="https://elsewhere"> injected into the page would be refused.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
