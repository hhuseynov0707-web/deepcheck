server {
    # soc-web: the SOC SPA and its API, on one origin, so the session cookie
    # (Path=/api, SameSite=Strict) goes with every API call and nowhere else.
    # Published on loopback only (docs/architecture-two-apps.md): this page
    # lists every customer's live session.
    listen 3100;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No access log: nginx's default one records every visitor's IP address,
    # and nothing here has a use for it. It also covers the /api/ proxy below.
    # The error log stays on, and an error line names the client address --
    # including each API call answered 502 while soc-api is still starting.
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. The /api/ proxy names soc-api through a variable,
    # so nginx looks it up per request (cached 10 s) instead of once at
    # startup: a literal proxy_pass host makes nginx refuse to start while
    # soc-api does not exist yet, and keeps a stale address after soc-api
    # restarts. The compose network is IPv4, hence ipv6=off.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Inherited only by locations that set no add_header of their own; every
    # location that does includes the snippet again (see the snippet for why).
    include /etc/nginx/snippets/security-headers.conf;

    # A single-page app: any path that is not a file is the app. try_files'
    # last argument is an internal redirect to /index.html, which the exact
    # location below answers with no-cache.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames change whenever their content does: safe to cache hard.
    # The bundled IBM Plex font files live here too.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html keeps its name across releases and points at the hashed
    # bundle; cached, a browser would keep loading yesterday's SOC.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # soc-api (apps/soc-server). Variable proxy_pass with no URI part, so
    # /api/... arrives exactly as the browser sent it, query string included.
    location /api/ {
        set $soc_api http://soc-api:8200;
        proxy_pass $soc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # REPLACED with the address nginx saw, never appended to: a client
        # can send any X-Forwarded-For it likes. soc-api ignores the header
        # unless FORWARDED_ALLOW_IPS names this proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The largest legitimate body is the login, {"key": "..."}; soc-api
        # refuses a key over 4096 characters anyway.
        client_max_body_size 16k;
        # soc-api gives the core 5 s to answer (CORE_TIMEOUT); nothing the
        # dashboard waits for needs longer than this.
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        # Scores and session ids belong to one moment; no cache may keep one.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
