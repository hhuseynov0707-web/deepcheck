# Security headers for every response soc-web sends, pages and API alike.
#
# Included from nginx.conf at server level AND inside every location that sets
# an add_header of its own, because nginx inherits add_header from the
# enclosing level only into locations that declare none: a location with its
# own Cache-Control would silently lose all of these otherwise. The Dockerfile
# copies this file to /etc/nginx/snippets/security-headers.conf.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# The SOC loads nothing from anywhere but its own origin: the bundle, its CSS
# and the IBM Plex files are all in /assets/, the API is /api/, and the tab
# icon is a data: URI in index.html. No inline script exists in the build, and
# inline style ATTRIBUTES are not used either -- React and D3 set styles
# through the CSSOM (element.style), which style-src does not govern. So the
# policy can be strict: an injected <script> or a stolen-data beacon to
# another host is refused by the browser.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
